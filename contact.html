  <body>
    <div id="myTopnav" class="topnav">

    <div class="section" style="border-top: none;">
      <div class="container">
        <span class="eyebrow">Contact</span>
        <h1 class="section-heading">Reach out! Shoot me an email!</h1>
        <p class="contact-email">angielin22@gmail.com</p>

        <form
          class="form-stack"
          action="mailto:angielin22+1@gmail.com"
          method="post"
          enctype="text/plain"
        >
          <div class="form-field">
            <label for="yourName">Your Name</label>
            <input type="text" id="yourName" name="yourName" value="" />
          </div>
          <div class="form-field">
            <label for="yourEmail">Your Email</label>
            <input type="email" id="yourEmail" name="yourEmail" value="" />
          </div>
          <div class="form-field">
            <label for="yourMessage">Your Message</label>
            <textarea id="yourMessage" name="yourMessage" rows="8"></textarea>
          </div>
          <button class="btn" type="submit">Send</button>
        </form>
      </div>
    </div>

    <div class="bottom-container">
      <div class="footer-links">
        <a class="linkedin-link" href="https://www.linkedin.com/in/angielin22">LinkedIn</a>
        <a class="github-link" href="https://github.com/angielin">Github</a>
      </div>
